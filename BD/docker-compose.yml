services:
  clinica_db:
    image: postgres:15
    container_name: shared_clinica_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: clinica_db
    ports:
      - "5433:5432" 
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_shared_data:/var/lib/postgresql/data

volumes:
  postgres_shared_data: