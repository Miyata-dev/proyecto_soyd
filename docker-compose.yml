version: '3.8'

services:
  api_gateway:
    build:
      context: ./api_gateway
    container_name: api_gateway_app
    restart: always
    ports:
      - "8080:8080" 
    environment:
      - PORT=8080
      - URL_FICHAS=http://sistema_fichas_app:3000
      - URL_TICKETS=http://sistema_tickets_app:3000
      - URL_BODEGA=http://sistema_bodega_app:5000 # Apunta al puerto 5000 de Flask
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_HOST=fichas_postgres
      - DB_PORT=5432
      - DB_NAME=fichas_db
    depends_on:
      - sistema_fichas
      - sistema_tickets
      - sistema_bodega
    networks:
      - clinica_network

  tickets_db:
    build:
      context: ./sistema_tickets/BD
    container_name: tickets_mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: tickets_db
      MARIADB_USER: admin
      MARIADB_PASSWORD: secretpassword
    ports:
      - "3308:3306" # Para pruebas locales
    volumes:
      - mariadb_tickets_data:/var/lib/mysql
    networks:
      - clinica_network

  sistema_tickets:
    build:
      context: ./sistema_tickets
    container_name: sistema_tickets_app
    restart: always
    environment:
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_HOST=tickets_db
      - DB_PORT=3306
      - DB_NAME=tickets_db
      - PORT=3000
      - REDIS_HOST=clinica_redis
    depends_on:
      - tickets_db
      - redis
    networks:
      - clinica_network

  fichas_db:
    build:
      context: ./sistema_fichas/BD
    container_name: fichas_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: fichas_db
    ports:
      - "5432:5432" # Para pruebas locales
    volumes:
      - postgres_fichas_data:/var/lib/postgresql/data
    networks:
      - clinica_network

  sistema_fichas:
    build:
      context: ./sistema_fichas
    container_name: sistema_fichas_app
    restart: always
    environment:
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_HOST=fichas_db
      - DB_PORT=5432
      - DB_NAME=fichas_db
      - PORT=3000
    depends_on:
      - fichas_db
    networks:
      - clinica_network

  bodega_db:
    build:
      context: ./sistema_bodega/BD
    container_name: bodega_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bodega_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: secretpassword
    ports:
      - "3307:3306" 
    volumes:
      - mysql_bodega_data:/var/lib/mysql
    networks:
      - clinica_network

  sistema_bodega:
    build:
      context: ./sistema_bodega
    container_name: sistema_bodega_app
    restart: always
    environment:
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_NAME=bodega_db
      - DB_MASTER_HOST=bodega_mysql
      - DB_REPLICA_HOST=bodega_mysql # Apunta temporalmente al master para lectura/escritura unificada
      - PORT=5000
    depends_on:
      - bodega_db
    networks:
      - clinica_network

  redis:
    image: redis:7-alpine
    container_name: clinica_redis
    restart: always
    networks:
      - clinica_network

frontend_clinica:
    build:
      context: ./frontend-clinica
    container_name: frontend_clinica_app
    restart: always
    ports:
      - "5173:80" # Mapea el puerto 80 del contenedor al 5173 de tu Mac
    depends_on:
      - api_gateway
    networks:
      - clinica_network

volumes:
  mariadb_tickets_data:
  postgres_fichas_data:
  mysql_bodega_data:

networks:
  clinica_network:
    driver: bridge