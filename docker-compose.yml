version: '3.8'

services:
  clinica_db:
    image: postgres:15-alpine
    container_name: shared_clinica_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: clinica_db
    ports:
      - "5433:5432" # Expuesto solo para pruebas locales con un cliente de BD
    volumes:
      - ./BD/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_shared_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d clinica_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - clinica_network

  # --- NUEVO: Capa de Seguridad (API Gateway) ---
  api_gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: api_gateway_app
    restart: always
    ports:
      - "8080:8080" # Único puerto expuesto hacia el exterior
    environment:
      - PORT=8080
      # Apuntamos a los nombres de los contenedores internamente
      - URL_FICHAS=http://sistema_fichas_app:3000
      - URL_TICKETS=http://sistema_tickets_app:3000
    depends_on:
      - sistema_fichas
      - sistema_tickets
    networks:
      - clinica_network

  sistema_tickets:
    build:
      context: ./sistema_tickets
      dockerfile: Dockerfile
    container_name: sistema_tickets_app
    restart: always
    # Eliminamos "ports" para aislarlo detrás del Gateway
    environment:
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_HOST=clinica_db
      - DB_PORT=5432
      - DB_NAME=clinica_db
      - PORT=3000
    depends_on:
      clinica_db:
        condition: service_healthy
    networks:
      - clinica_network
    
  sistema_fichas:
      build:
        context: ./sistema_fichas
        dockerfile: Dockerfile
      container_name: sistema_fichas_app
      restart: always
      # Eliminamos "ports" para aislarlo detrás del Gateway
      environment:
        - DB_USER=admin
        - DB_PASSWORD=secretpassword
        - DB_HOST=clinica_db
        - DB_PORT=5432
        - DB_NAME=clinica_db
        - PORT=3000 # Añadido por seguridad para que coincida con tu index.js
      depends_on:
        clinica_db:
          condition: service_healthy
      networks:
        - clinica_network

volumes:
  postgres_shared_data:

networks:
  clinica_network:
    driver: bridge