services:
  api-gateway:
    build:
      context: ./api_gateway
    image: api-gateway:local
    restart: always
    ports:
      - "8080:8080" 
    environment:
      - PORT=8080
      - URL_FICHAS=http://sistema-fichas:3000
      - URL_TICKETS=http://sistema-tickets:3000
      - URL_BODEGA=http://sistema-bodega:5000
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_HOST=fichas-db
      - DB_PORT=5432
      - DB_NAME=fichas_db
    depends_on:
      - sistema-fichas
      - sistema-tickets
      - sistema-bodega
    networks:
      - clinica-network

  tickets-db:
    build:
      context: ./sistema_tickets/BD
    image: tickets-db:local
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: tickets_db
      MARIADB_USER: admin
      MARIADB_PASSWORD: secretpassword
    expose:    
      - "3306"
    volumes:
      - mariadb-tickets-data:/var/lib/mysql
    networks:
      - clinica-network

  sistema-tickets:
    build:
      context: ./sistema_tickets
    image: sistema-tickets:local
    restart: always
    expose:
      - "3000"
    environment:
      - SERVER_PORT=3000
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_HOST=tickets-db
      - DB_PORT=3306
      - DB_NAME=tickets_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
    depends_on:
      - tickets-db
      - redis
    networks:
      - clinica-network

  fichas-db:
    build:
      context: ./sistema_fichas/BD
    image: fichas-db:local
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: fichas_db
    expose:            
      - "5432"
    volumes:
      - postgres-fichas-data:/var/lib/postgresql/data
    networks:
      - clinica-network

  sistema-fichas:
    build:
      context: ./sistema_fichas
    image: sistema-fichas:local
    restart: always
    expose:
      - "3000"
    deploy:
      replicas: 2
    environment:
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_HOST=fichas-db
      - DB_PORT=5432
      - DB_NAME=fichas_db
      - PORT=3000
    depends_on:
      - fichas-db
    networks:
      - clinica-network

  bodega-db:
    build:
      context: ./sistema_bodega/BD
    image: bodega-db:local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bodega_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: secretpassword
    expose:     
      - "3306"
    volumes:
      - mysql-bodega-data:/var/lib/mysql
    networks:
      - clinica-network

  bodega-mysql-replica:
    build:
      context: ./sistema_bodega/BD   
    image: bodega-db-replica:local
    restart: always
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bodega_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: secretpassword
    networks:
      - clinica-network

  sistema-bodega:
    build:
      context: ./sistema_bodega
    image: sistema-bodega:local
    restart: always
    expose:
      - "5000"
    environment:
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_NAME=bodega_db
      - DB_MASTER_HOST=bodega-db
      - DB_REPLICA_HOST=bodega-db
      - PORT=5000
    depends_on:
      - bodega-db
      #- bodega-mysql-replica
    networks:
      - clinica-network

  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - "6379"
    networks:
      - clinica-network

  frontend-clinica:
    build:
      context: ./frontend-clinica
    image: frontend-clinica:local
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - clinica-network

volumes:
  mariadb-tickets-data:
  postgres-fichas-data:
  mysql-bodega-data:

networks:
  clinica-network:
    driver: bridge