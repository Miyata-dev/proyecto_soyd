apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\Users\chlor\AppData\Local\Microsoft\WinGet\Links\kompose.exe convert -f docker-compose.yml -o k8s/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: bodega-db
  name: bodega-db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: bodega-db
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\Users\chlor\AppData\Local\Microsoft\WinGet\Links\kompose.exe convert -f docker-compose.yml -o k8s/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: bodega-db
    spec:
      containers:
        - env:
            - name: MYSQL_DATABASE
              value: bodega_db
            - name: MYSQL_PASSWORD
              value: secretpassword
            - name: MYSQL_ROOT_PASSWORD
              value: rootpassword
            - name: MYSQL_USER
              value: admin
          image: bodega-db:local
          name: bodega-db
          ports:
            - containerPort: 3306
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-bodega-data
      restartPolicy: Always
      volumes:
        - name: mysql-bodega-data
          persistentVolumeClaim:
            claimName: mysql-bodega-data
