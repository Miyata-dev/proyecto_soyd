apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\Users\chlor\AppData\Local\Microsoft\WinGet\Links\kompose.exe convert -f docker-compose.yml -o k8s/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: fichas-db
  name: fichas-db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: fichas-db
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\Users\chlor\AppData\Local\Microsoft\WinGet\Links\kompose.exe convert -f docker-compose.yml -o k8s/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: fichas-db
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: fichas_db
            - name: POSTGRES_PASSWORD
              value: secretpassword
            - name: POSTGRES_USER
              value: admin
          image: fichas-db:local
          name: fichas-db
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-fichas-data
      restartPolicy: Always
      volumes:
        - name: postgres-fichas-data
          persistentVolumeClaim:
            claimName: postgres-fichas-data
