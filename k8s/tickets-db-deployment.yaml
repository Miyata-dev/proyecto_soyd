apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\Users\chlor\AppData\Local\Microsoft\WinGet\Links\kompose.exe convert -f docker-compose.yml -o k8s/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: tickets-db
  name: tickets-db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: tickets-db
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\Users\chlor\AppData\Local\Microsoft\WinGet\Links\kompose.exe convert -f docker-compose.yml -o k8s/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: tickets-db
    spec:
      containers:
        - env:
            - name: MARIADB_DATABASE
              value: tickets_db
            - name: MARIADB_PASSWORD
              value: secretpassword
            - name: MARIADB_ROOT_PASSWORD
              value: rootpassword
            - name: MARIADB_USER
              value: admin
          image: tickets-db:local
          name: tickets-db
          ports:
            - containerPort: 3306
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mariadb-tickets-data
      restartPolicy: Always
      volumes:
        - name: mariadb-tickets-data
          persistentVolumeClaim:
            claimName: mariadb-tickets-data
